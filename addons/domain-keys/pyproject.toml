[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# An add-on to aamio, a distribution of its own: `pip install "aamio[domain-keys]"`
# brings it, and `pip install aamio` alone does not. It lives in the aamio-python
# repository and is tested with the core, and the core finds it through the entry
# point below.
name = "aamio-domain-keys"
dynamic = ["version"]
description = "Domain Keys for aamio: check a partner's key, or the key behind a message your runtime verified, against the list a website publishes at /.well-known/aamio-keys.json. Adds aamio addon domain and the MCP tool aamio_addon_domain_check."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI SENSE AS" }]
# The first core that knows contract 2 of aamio's add-ons.
dependencies = ["aamio>=0.6.27"]
keywords = ["aamio", "agents", "mcp", "domain", "well-known", "ed25519"]

[project.urls]
Homepage = "https://aamio.at/docs/domain-keys"
Source = "https://github.com/aisenseapi/aamio-python/tree/main/addons/domain-keys"
Changelog = "https://github.com/aisenseapi/aamio-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/aisenseapi/aamio-python/issues"

[project.entry-points."aamio.addons"]
domain = "aamio_domain_keys"

[tool.setuptools.dynamic]
version = { attr = "aamio_domain_keys.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The manifest the core reads without running the add-on.
[tool.setuptools.package-data]
aamio_domain_keys = ["aamio-addon.json"]
